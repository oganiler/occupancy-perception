services:
  occ:
    build:
      context: .
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: occ-pipeline:dev
    working_dir: /workspace
    volumes:
      # Source is bind-mounted so edits take effect without a rebuild.
      - ./:/workspace
      # Dataset stays outside the image. Read-only: GT generation must
      # never be able to modify the raw data.
      - ${NUSCENES_ROOT:-${HOME}/data/nuscenes}:/data/nuscenes:ro
      # Named volume so the torchvision weight cache survives --rm containers.
      - torch-cache:/home/dev/.cache/torch
    environment:
      NUSCENES_ROOT: /data/nuscenes
    stdin_open: true
    tty: true

# Named volumes must be declared at the top level. Bind mounts do not,
# because the host path already exists.
volumes:
  torch-cache:    