[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "occupancy-perception"
version = "0.1.0"
description = "3D semantic occupancy GT generation and DL pipeline on nuScenes"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["occupancy*"]

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    # matplotlib 3.8 calls deprecated pyparsing methods; not actionable here.
    "ignore::DeprecationWarning:matplotlib",
    "ignore:.*parseString.*:DeprecationWarning",
    "ignore:.*resetCache.*:DeprecationWarning",
    "ignore:.*enablePackrat.*:DeprecationWarning",
]